<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Dégradé de fond : Ardoise sombre à gauche vers Bleu Cloud/Virtualisation à droite -->
    <linearGradient id="bgCloudVM" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0.98" />
      <stop offset="45%" stop-color="#0f172a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#075985" stop-opacity="0.8" />
    </linearGradient>

    <!-- Masque d'assombrissement renforcé sur la gauche pour la lisibilité du texte -->
    <linearGradient id="leftDarkenCloudVM" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0.98" />
      <stop offset="50%" stop-color="#020617" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0.0" />
    </linearGradient>

    <!-- Dégradé lumineux pour le nuage -->
    <linearGradient id="cloudGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1" />
    </linearGradient>

    <!-- Grille technologique subtile -->
    <pattern id="cloudGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Arrière-plan -->
  <rect width="1200" height="400" fill="url(#bgCloudVM)" />
  <rect width="1200" height="400" fill="url(#cloudGrid)" />

  <!-- Lignes de bus système et flux réseau -->
  <g stroke="#0284c7" stroke-width="1.2" stroke-dasharray="5,5" opacity="0.35">
    <path d="M 100 220 C 300 120, 450 280, 650 180 S 850 220, 1000 140" fill="none" />
    <path d="M 50 290 C 250 340, 450 100, 750 240 L 1150 200" fill="none" stroke="#38bdf8" />
  </g>

  <!-- NUAGE TECHNOLOGIQUE EN ARRIÈRE-PLAN (Symbole Cloud Computing) -->
  <g transform="translate(740, 70)" opacity="0.85">
    <path d="M 80,110 C 50,110 30,130 30,155 C 30,175 45,195 70,200 L 290,200 C 315,195 330,175 330,155 C 330,130 310,110 285,110 C 275,75 240,50 200,50 C 160,50 125,75 115,110 C 105,100 90,110 80,110 Z" fill="url(#cloudGlow)" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.75" />
  </g>

  <!-- STACK DE VIRTUALISATION SUR SOCLE UNIQUE (BARE-METAL & HYPERVISOR) -->
  <g transform="translate(850, 100)">
    
    <!-- 1. SOCLE MATÉRIEL (Hardware / Host Server) -->
    <g id="hardware-layer">
      <polygon points="0,150 120,80 240,150 120,220" fill="#0f172a" opacity="0.95" stroke="#334155" stroke-width="1.5" />
      <polygon points="0,150 120,220 120,250 0,180" fill="#020617" opacity="0.95" />
      <polygon points="120,220 240,150 240,180 120,250" fill="#0f172a" opacity="0.95" />
      <line x1="20" y1="162" x2="100" y2="208" stroke="#38bdf8" stroke-width="2" opacity="0.6" />
      <line x1="20" y1="172" x2="100" y2="218" stroke="#38bdf8" stroke-width="2" opacity="0.6" />
    </g>

    <!-- 2. COUCHE HYPERVISEUR -->
    <g id="hypervisor-layer">
      <polygon points="10,135 120,70 230,135 120,200" fill="#0284c7" opacity="0.85" stroke="#38bdf8" stroke-width="1.5" />
      <polygon points="10,135 120,200 120,210 10,145" fill="#0369a1" opacity="0.9" />
      <polygon points="120,200 230,135 230,145 120,210" fill="#075985" opacity="0.95" />
    </g>

    <!-- 3. MACHINES VIRTUELLES (VMs) -->
    <!-- VM 1 -->
    <g transform="translate(20, 20)">
      <polygon points="0,60 50,30 100,60 50,90" fill="#38bdf8" opacity="0.85" />
      <polygon points="0,60 50,90 50,120 0,90" fill="#0284c7" opacity="0.9" />
      <polygon points="50,90 100,60 100,90 50,120" fill="#0369a1" opacity="0.95" />
      <circle cx="50" cy="60" r="4" fill="#ffffff" opacity="0.8" />
    </g>

    <!-- VM 2 -->
    <g transform="translate(70, -20)">
      <polygon points="0,60 50,30 100,60 50,90" fill="#34d399" opacity="0.85" />
      <polygon points="0,60 50,90 50,120 0,90" fill="#059669" opacity="0.9" />
      <polygon points="50,90 100,60 100,90 50,120" fill="#047857" opacity="0.95" />
      <circle cx="50" cy="60" r="4" fill="#ffffff" opacity="0.8" />
    </g>

    <!-- VM 3 -->
    <g transform="translate(120, 20)">
      <polygon points="0,60 50,30 100,60 50,90" fill="#818cf8" opacity="0.85" />
      <polygon points="0,60 50,90 50,120 0,90" fill="#4f46e5" opacity="0.9" />
      <polygon points="50,90 100,60 100,90 50,120" fill="#3730a3" opacity="0.95" />
      <circle cx="50" cy="60" r="4" fill="#ffffff" opacity="0.8" />
    </g>

  </g>

  <!-- Nœuds et indicateurs lumineux -->
  <g fill="#38bdf8">
    <circle cx="540" cy="180" r="6" opacity="0.9"/>
    <circle cx="540" cy="180" r="16" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
    <circle cx="700" cy="120" r="5" fill="#34d399" opacity="0.8"/>
  </g>

  <!-- Calque d'assombrissement final projeté sur la gauche -->
  <rect width="1200" height="400" fill="url(#leftDarkenCloudVM)" />
</svg>
