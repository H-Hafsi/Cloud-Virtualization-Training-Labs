# ---------------------------------------------------------------
# Dépôt modèle : site de cours (MkDocs Material + GitHub Pages)
# À personnaliser : site_name, site_url, repo_url, extra.matiere, nav
# ---------------------------------------------------------------
site_name: "Cloud et virtualisation"
site_description: Cours et travaux pratiques – Master DevOps et Cloud Computing, ISET Tozeur
site_url: https://h-hafsi.github.io/Cloud-Virtualization-Training-Labs/
repo_url: https://github.com/H-Hafsi/Cloud-Virtualization-Training-Labs
repo_name: H-Hafsi/Cloud-Virtualization-Training-Labs
copyright: © 2026 ISET Tozeur – Département Informatique

theme:
  name: material
  custom_dir: overrides
  language: fr
  logo: assets/img/logo-iset.svg
  favicon: assets/img/logo-iset.svg
  font:
    text: Source Sans 3
    code: JetBrains Mono
  # Mode sombre par défaut (premier élément), bouton de bascule vers le mode clair.
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Passer en mode clair / Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Passer en mode sombre / Switch to dark mode
  features:
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

extra_css:
  - assets/css/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang:
        - fr
        - en

# Textes de la page d'accueil (voir overrides/home.html)
extra:
  matiere:
    etiquette: "Master DevOps et Cloud Computing · ISET Tozeur"
    titre: "Cloud et virtualisation : concevoir et exploiter une infrastructure virtualisée"
    sous_titre: "Du datacenter au cloud : virtualiser, stocker, connecter, automatiser et exploiter une infrastructure avec des outils libres et gratuits."
    premier_lien: partie-1-datacenter-et-virtualisation-sur-poste-de-travail/ch01-architecture-et-composants-d-un-datacenter/cours/
    chiffres:
      - { valeur: "84 h", libelle: "de formation" }
      - { valeur: "6", libelle: "crédits ECTS" }
      - { valeur: "4", libelle: "parties" }
      - { valeur: "22", libelle: "chapitres" }
      - { valeur: "9", libelle: "acquis d'apprentissage" }

